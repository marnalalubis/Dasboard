<script>
  function initMenuRekapImport() {
    // Default muat sub-menu pertama (Rekap Status ASN)
    if (typeof loadRekapitulasiData === 'function') {
      loadRekapitulasiData();
    }
  }

  function switchRekapView(view) {
    // Proteksi Hak Akses: Cegah Pelihat membuka tab import CSV
    if (view === 'import' && !document.body.classList.contains('is-admin')) {
      if (typeof showToast === 'function') {
        showToast('Akses Terbatas: Fitur Upload CSV hanya untuk Admin BKPSDM.', 'warning');
      }
      view = 'rekap';
    }

    var isRekap = view === 'rekap';
    var isGol = view === 'rekap-gol';
    var isPend = view === 'rekap-pend';
    var isJab = view === 'rekap-jab';
    var isImport = view === 'import';

    // Elemen Container Sub-View
    var subviewRekap = document.getElementById('subview-rekap-table');
    var subviewGol = document.getElementById('subview-rekap-golongan');
    var subviewPend = document.getElementById('subview-rekap-pendidikan');
    var subviewJab = document.getElementById('subview-rekap-jenis-jabatan');
    var subviewImport = document.getElementById('subview-csv-import');

    if (subviewRekap) subviewRekap.style.display = isRekap ? 'block' : 'none';
    if (subviewGol) subviewGol.style.display = isGol ? 'block' : 'none';
    if (subviewPend) subviewPend.style.display = isPend ? 'block' : 'none';
    if (subviewJab) subviewJab.style.display = isJab ? 'block' : 'none';
    if (subviewImport) subviewImport.style.display = isImport ? 'block' : 'none';
    
    // Elemen Tombol Sub-Nav
    var btnRekap = document.getElementById('subtab-rekap-btn');
    var btnGol = document.getElementById('subtab-rekap-gol-btn');
    var btnPend = document.getElementById('subtab-rekap-pend-btn');
    var btnJab = document.getElementById('subtab-rekap-jab-btn');
    var btnImport = document.getElementById('subtab-import-btn');

    if (btnRekap) btnRekap.className = isRekap ? 'btn btn-accent' : 'btn btn-ghost';
    if (btnGol) btnGol.className = isGol ? 'btn btn-accent' : 'btn btn-ghost';
    if (btnPend) btnPend.className = isPend ? 'btn btn-accent' : 'btn btn-ghost';
    if (btnJab) btnJab.className = isJab ? 'btn btn-accent' : 'btn btn-ghost';
    if (btnImport) btnImport.className = isImport ? 'btn btn-accent admin-only-tab' : 'btn btn-ghost admin-only-tab';

    var subitemsRekap = {
      'rekap': 'subitem-rekap-opd',
      'rekap-gol': 'subitem-rekap-gol',
      'rekap-pend': 'subitem-rekap-pend',
      'rekap-jab': 'subitem-rekap-jab',
      'import': 'subitem-rekap-import'
    };
    for (var r in subitemsRekap) {
      var elR = document.getElementById(subitemsRekap[r]);
      if (elR) elR.classList.toggle('active', r === view);
    }

    // Lazy Loading Panggilan Server Sesuai Subtab Aktif
    if (isRekap && typeof loadRekapitulasiData === 'function') {
      loadRekapitulasiData();
    } else if (isGol && typeof loadRekapGolonganData === 'function') {
      loadRekapGolonganData();
    } else if (isPend && typeof loadRekapPendidikanData === 'function') {
      loadRekapPendidikanData();
    } else if (isJab && typeof loadRekapJenisJabatanData === 'function') {
      loadRekapJenisJabatanData();
    }
  }

  /**
   * Helper Pengunduh Berkas Base64 (Untuk PDF & Excel Rekapitulasi)
   */
  function downloadBase64File(base64Data, fileName, mimeType) {
    var linkSource = 'data:' + mimeType + ';base64,' + base64Data;
    var downloadLink = document.createElement('a');
    downloadLink.href = linkSource;
    downloadLink.download = fileName;
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
  }

  // Daftarkan ke window global untuk keandalan interaksi
  window.initMenuRekapImport = initMenuRekapImport;
  window.switchRekapView = switchRekapView;
  window.downloadBase64File = downloadBase64File;
</script>
